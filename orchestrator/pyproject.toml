[project]
name = "medulla-local"
version = "0.12.1"
description = "Local agent coordination with explicit ownership and reviewed evidence"
requires-python = ">=3.11"
dependencies = []
license = {text = "GPL-3.0-only"}

[project.scripts]
medulla-local = "medulla_local.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
medulla_local = ["web/*"]
